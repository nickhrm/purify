[project]
name = "purify"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "gymnasium>=1.1.1",
    "matplotlib>=3.10.7",
    "numpy>=2.3.4",
    "optuna>=4.7.0",
    "pandas>=2.3.3",
    "seaborn>=0.13.2",
    "stable-baselines3[extra]>=2.7.0",
    "tensorboard>=2.20.0",
]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "pytest>=8.0",
    "ruff>=0.14.2",
    "ty>=0.0.11",
]


[project.scripts]
train = "ppo.trainer:main"
evaluate = "ppo.evaluate:main"


[build-system]
requires = ["uv_build>=0.8.11,<0.9.0"]
build-backend = "uv_build"


[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Wähle die wichtigsten Regel-Sets aus. Ein guter Start:
select = [
    "E",  # pycodestyle errors
    "F",  # Pyflakes (logische Fehler wie unbenutzte Variablen)
    "W",  # pycodestyle warnings
    "I",  # isort (Import-Sortierung)
    "UP", # pyupgrade (modernisiert deinen Code)
]
